<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simone Soares | Consultora de Negócios Imobiliários</title>
  <style>
    :root {
      --bg-1: #070a11;
      --bg-2: #0e1525;
      --bg-3: #15141f;
      --card: rgba(19, 27, 42, 0.92);
      --gold: #eab308;
      --gold-bright: #fde047;
      --gold-soft: rgba(234, 179, 8, 0.16);
      --green: #22c55e;
      --green-dark: #16a34a;
      --text: #f9fafb;
      --muted: #9ca3af;
      --border: rgba(148, 163, 184, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Fundo animado */
    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body {
      min-height: 100vh;
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 64px;
      background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), #0b1320);
      background-size: 350% 350%;
      animation: bgShift 16s ease infinite;
    }

    /* Cabeçalho */
    header {
      position: relative;
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.95) 0%, rgba(11, 15, 23, 0.75) 100%);
      border-bottom: 1px solid var(--border);
      padding: 32px 16px 26px;
      text-align: center;
      overflow: hidden;
    }

    header::before {
      content: "";
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      height: 180px;
      background: radial-gradient(circle, rgba(234, 179, 8, 0.22) 0%, transparent 70%);
      pointer-events: none;
    }

    @keyframes floatAvatar {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .avatar-wrap {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #fde047, #d97706, #fde047);
      margin: 0 auto 14px;
      box-shadow: 0 0 24px rgba(234, 179, 8, 0.35);
      animation: floatAvatar 3.6s ease-in-out infinite;
      cursor: default;
      user-select: none;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #111827;
    }

    header h1 {
      font-size: 1.7rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .subtitle {
      color: var(--gold-bright);
      font-size: 0.96rem;
      font-weight: 600;
      margin-top: 3px;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.65; }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 999px;
      margin-top: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulseDot 1.8s infinite;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 22px 16px;
    }

    /* Barra de Filtros */
    .filters-box {
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 26px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      background: rgba(11, 15, 23, 0.85);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.22s ease;
    }

    .filter-btn:hover {
      border-color: var(--gold);
      color: #fff;
      transform: translateY(-1px);
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #facc15, #eab308);
      color: #090d16;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(234, 179, 8, 0.35);
    }

    .city-select {
      background: rgba(11, 15, 23, 0.9);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    /* Grid & Animação de Entrada */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(315px, 1fr));
      gap: 24px;
    }

    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: fadeInUp 0.45s ease both;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(250, 204, 21, 0.55);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.5);
    }

    /* ============================================================
       ANIMAÇÃO DE FOGO / OPORTUNIDADE ÚNICA
       ============================================================ */
    @keyframes fireAura {
      0%, 100% {
        box-shadow:
          0 0 16px rgba(255, 69, 0, 0.8),
          0 0 34px rgba(255, 111, 0, 0.5),
          0 0 55px rgba(220, 38, 38, 0.25);
        border-color: #ff5722;
      }
      50% {
        box-shadow:
          0 0 26px rgba(255, 193, 7, 0.95),
          0 0 48px rgba(255, 69, 0, 0.72),
          0 0 70px rgba(245, 158, 11, 0.35);
        border-color: #facc15;
      }
    }

    @keyframes fireStripe {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fireBounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .card.on-fire {
      border: 2px solid #ff5722;
      animation: fadeInUp 0.45s ease both, fireAura 1.9s infinite ease-in-out;
      background: linear-gradient(180deg, rgba(69, 10, 10, 0.42) 0%, rgba(19, 27, 42, 0.96) 42%);
    }

    .fire-banner {
      background: linear-gradient(270deg, #dc2626, #ea580c, #f59e0b, #ea580c, #dc2626);
      background-size: 300% 300%;
      animation: fireStripe 2.4s ease infinite, fireBounce 1.4s ease-in-out infinite;
      color: #ffffff;
      font-size: 0.76rem;
      font-weight: 800;
      text-align: center;
      padding: 7px 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.75);
    }

    /* Carrossel */
    .carousel {
      position: relative;
      width: 100%;
      height: 235px;
      background: #080c14;
      overflow: hidden;
    }

    .carousel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: zoom-in;
      display: block;
      transition: transform 0.35s ease;
    }

    .card:hover .carousel img {
      transform: scale(1.03);
    }

    .badge-cat {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(6px);
      border: 1px solid var(--gold);
      color: var(--gold-bright);
      font-size: 0.73rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 7px;
      text-transform: uppercase;
      z-index: 2;
    }

    .photo-counter {
      position: absolute;
      bottom: 10px;
      right: 12px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 7px;
      z-index: 2;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(9, 13, 22, 0.78);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: var(--gold);
      color: #090d16;
    }

    .prev-btn { left: 10px; }
    .next-btn { right: 10px; }

    /* Conteúdo do Card */
    .card-body {
      padding: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .price {
      font-size: 1.38rem;
      font-weight: 900;
      color: var(--gold-bright);
      margin-bottom: 4px;
    }

    .card.on-fire .price {
      color: #fb923c;
      text-shadow: 0 0 12px rgba(251, 146, 60, 0.35);
    }

    .title {
      font-size: 1.08rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .location {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .features {
      list-style: none;
      margin-bottom: 18px;
      flex: 1;
    }

    .features li {
      font-size: 0.86rem;
      color: #e5e7eb;
      padding: 4px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.07);
    }

    .features li:last-child {
      border-bottom: none;
    }

    .btn-whats {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #052e16;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.92rem;
      padding: 12px 14px;
      border-radius: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: auto;
      box-shadow: 0 6px 18px rgba(34, 197, 94, 0.28);
    }

    .btn-whats:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(34, 197, 94, 0.42);
    }

    .card.on-fire .btn-whats {
      background: linear-gradient(135deg, #ef4444, #f97316, #facc15);
      color: #180600;
      box-shadow: 0 6px 22px rgba(249, 115, 22, 0.45);
    }

    /* Modais */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(6px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .modal.open {
      display: flex;
    }

    .modal img.zoom-target {
      max-width: 100%;
      max-height: 88vh;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 22px;
      color: #fff;
      font-size: 26px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.12);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
    }

    .admin-box {
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      position: relative;
      margin: auto;
    }

    .admin-panel-box {
      max-width: 820px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .admin-box h2 {
      color: var(--gold-bright);
      font-size: 1.25rem;
      margin-bottom: 14px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: #0b0f17;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 87, 34, 0.14);
      border: 1px solid rgba(255, 87, 34, 0.45);
      padding: 10px 12px;
      border-radius: 8px;
      margin: 12px 0;
      cursor: pointer;
    }

    .checkbox-row input {
      width: 18px;
      height: 18px;
      accent-color: #ff5722;
    }

    .btn-primary {
      background: var(--gold);
      color: #090d16;
      border: none;
      padding: 11px 16px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      font-size: 0.92rem;
    }

    .btn-secondary {
      background: #1f2937;
      color: #fff;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-danger {
      background: rgba(220, 38, 38, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(220, 38, 38, 0.5);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .admin-item-row {
      background: #0b0f17;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .admin-actions {
      display: flex;
      gap: 8px;
    }

    .error-msg {
      color: #f87171;
      font-size: 0.82rem;
      margin-top: 8px;
      display: none;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 44px;
      padding: 0 16px;
    }
  </style>
</head>
<body>

  <header>
    <!-- Gatilho oculto: 5 cliques rápidos no avatar da Simone -->
    <div class="avatar-wrap" id="secret-trigger">
      <img src="img/avatar-simone.jpg" alt="Simone Soares" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'width:100%;height:100%;border-radius:50%;background:#111827;color:#fde047;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;\'>SS</div>';" />
    </div>
    <h1>Simone Soares</h1>
    <p class="subtitle">Consultora de Negócios Imobiliários</p>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Atendimento comercial até às 17h</span>
    </div>
  </header>

  <main class="container">
    <div class="filters-box">
      <div class="filter-group" id="category-filters">
        <button class="filter-btn active" data-cat="todos">Todos os Imóveis</button>
        <button class="filter-btn" data-cat="locacao">Locação Residencial</button>
        <button class="filter-btn" data-cat="venda">Venda</button>
        <button class="filter-btn" data-cat="comercial">Comercial</button>
        <button class="filter-btn" data-cat="eventos">Espaço para Eventos</button>
      </div>

      <select class="city-select" id="city-filter">
        <option value="todas">Todas as Cidades</option>
        <option value="Ferraz de Vasconcelos">Ferraz de Vasconcelos</option>
        <option value="Itaquaquecetuba">Itaquaquecetuba</option>
      </select>
    </div>

    <div class="grid" id="properties-grid"></div>
  </main>

  <footer>
    <p>Simone Soares — Consultora de Negócios | Atendimento comercial até às 17h</p>
  </footer>

  <!-- Modal Zoom Foto -->
  <div class="modal" id="photo-modal" onclick="closeModal('photo-modal')">
    <button class="modal-close">&times;</button>
    <img class="zoom-target" id="modal-img" src="" alt="Visualização ampliada" />
  </div>

  <!-- Modal Login Oculto -->
  <div class="modal" id="login-modal">
    <div class="admin-box">
      <button class="modal-close" style="top:12px; right:12px; width:32px; height:32px; font-size:20px;" onclick="closeModal('login-modal')">&times;</button>
      <h2>Acesso Restrito</h2>
      <div class="form-group">
        <label>Login</label>
        <input type="text" id="adm-user" autocomplete="off" />
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="adm-pass" />
      </div>
      <button class="btn-primary" onclick="checkLogin()">Entrar</button>
      <p class="error-msg" id="login-error">Credenciais inválidas.</p>
    </div>
  </div>

  <!-- Modal Painel Administrador -->
  <div class="modal" id="admin-modal">
    <div class="admin-box admin-panel-box">
      <button class="modal-close" style="top:14px; right:14px; width:34px; height:34px; font-size:20px;" onclick="closeModal('admin-modal')">&times;</button>
      <h2>Painel de Gestão de Imóveis</h2>

      <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;">
        <button class="btn-primary" style="width:auto;" onclick="openEditForm()">+ Adicionar Novo Imóvel</button>
        <button class="btn-secondary" onclick="exportUpdatedCode()">📋 Copiar Código Atualizado (p/ GitHub)</button>
        <button class="btn-danger" onclick="resetDefaultData()">Restaurar Padrão</button>
      </div>

      <div id="edit-form-container" style="display:none; background:#0b0f17; border:1px solid var(--gold); border-radius:12px; padding:16px; margin-bottom:20px;">
        <h3 id="form-title" style="color:#fff; font-size:1rem; margin-bottom:12px;">Editar Imóvel</h3>
        <input type="hidden" id="edit-index" />

        <div class="form-group">
          <label>Título do Anúncio</label>
          <input type="text" id="f-titulo" />
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <div class="form-group">
            <label>Preço / Valor</label>
            <input type="text" id="f-preco" />
          </div>
          <div class="form-group">
            <label>Categoria</label>
            <select id="f-categoria">
              <option value="locacao">Locação Residencial</option>
              <option value="venda">Venda</option>
              <option value="comercial">Comercial</option>
              <option value="eventos">Espaço para Eventos</option>
            </select>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <div class="form-group">
            <label>Cidade (Filtro)</label>
            <input type="text" id="f-cidade" />
          </div>
          <div class="form-group">
            <label>Endereço / Bairro Exibido</label>
            <input type="text" id="f-localizacao" />
          </div>
        </div>

        <div class="form-group">
          <label>Características (1 por linha)</label>
          <textarea id="f-caracteristicas" rows="4"></textarea>
        </div>

        <div class="form-group">
          <label>Caminhos ou Links das Fotos (1 por linha)</label>
          <textarea id="f-fotos" rows="3"></textarea>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="f-destaque" />
          <span style="font-size:0.88rem; font-weight:700; color:#ffb74d;">
            🔥 Ativar Fogo em volta do anúncio (Oportunidade Única / Sai Rápido)
          </span>
        </label>

        <div style="display:flex; gap:10px; margin-top:12px;">
          <button class="btn-primary" onclick="saveProperty()">Salvar Imóvel</button>
          <button class="btn-secondary" onclick="cancelEdit()">Cancelar</button>
        </div>
      </div>

      <div id="admin-list"></div>
    </div>
  </div>

  <script>

      {

        cidade: "Itaquaquecetuba",
        localizacao: "Itaquaquecetuba – SP",
        preco: "Consulte valor da diária",
        destaqueFogo: false,
        fotos: [
          "img/evento1.jpg",
          "img/evento2.jpg",
          "img/evento3.jpg",
          "img/evento4.jpg",
          "img/evento5.jpg"
        ],
        caracteristicas: [
          "Piscina com cascata e iluminação",
          "Área gourmet coberta com churrasqueira",
          "Mesa de sinuca e pebolim",
          "Mesas, cadeiras, freezer e fogão inclusos"
        ]
      }
    ];

    const CAT_LABELS = {
      locacao: "Locação Residencial",
      venda: "Venda",
      comercial: "Comercial",
      eventos: "Lazer & Eventos"
    };

    let imoveis = JSON.parse(localStorage.getItem("simone_catalogo_v2")) || JSON.parse(JSON.stringify(DEFAULT_IMOVEIS));
    const photoIndexes = {};
    let currentCategory = "todos";
    let currentCity = "todas";

    let clickCount = 0;
    let clickTimer = null;

    document.getElementById("secret-trigger").addEventListener("click", () => {
      clickCount++;
      clearTimeout(clickTimer);
      clickTimer = setTimeout(() => { clickCount = 0; }, 1800);

      if (clickCount >= 5) {
        clickCount = 0;
        document.getElementById("adm-user").value = "";
        document.getElementById("adm-pass").value = "";
        document.getElementById("login-error").style.display = "none";
        document.getElementById("login-modal").classList.add("open");
      }
    });

    function checkLogin() {
      const u = document.getElementById("adm-user").value.trim();
      const p = document.getElementById("adm-pass").value.trim();

      if (u === "Vidanova2027" && p === "vidanova2027") {
        closeModal("login-modal");
        openAdminPanel();
      } else {
        document.getElementById("login-error").style.display = "block";
      }
    }

    document.getElementById("adm-pass").addEventListener("keypress", (e) => {
      if (e.key === "Enter") checkLogin();
    });

    function fallbackImg(imgEl, src) {
      imgEl.onerror = null;
      const svg = encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
          <rect width="600" height="400" fill="#111827"/>
          <text x="300" y="185" fill="#fde047" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Foto nao encontrada na pasta</text>
          <text x="300" y="218" fill="#9ca3af" font-family="monospace" font-size="16" text-anchor="middle">${src}</text>
        </svg>`
      );
      imgEl.src = `data:image/svg+xml,${svg}`;
    }

    function renderProperties() {
      const grid = document.getElementById("properties-grid");
      grid.innerHTML = "";

      const ordenados = [...imoveis].sort((a, b) => (b.destaqueFogo ? 1 : 0) - (a.destaqueFogo ? 1 : 0));

      const filtrados = ordenados.filter(item => {
        const matchCat = currentCategory === "todos" || item.categoria === currentCategory;
        const matchCity = currentCity === "todas" || item.cidade.toLowerCase() === currentCity.toLowerCase();
        return matchCat && matchCity;
      });

      if (filtrados.length === 0) {
        grid.innerHTML = `<p style="color:#9ca3af; grid-column: 1/-1; text-align:center; padding: 30px;">Nenhum imóvel encontrado com esse filtro no momento.</p>`;
        return;
      }

      filtrados.forEach((item, i) => {
        if (photoIndexes[item.id] === undefined) photoIndexes[item.id] = 0;
        const fotos = item.fotos && item.fotos.length ? item.fotos : ["img/casa1.jpg"];
        const idx = photoIndexes[item.id] % fotos.length;
        const currentSrc = fotos[idx];

        const msg = encodeURIComponent(
          `Olá! Vi o imóvel *${item.titulo}* (${item.id}) no catálogo online da Simone Soares e gostaria de mais informações.`
        );
        const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
        const catLabel = CAT_LABELS[item.categoria] || item.categoria;

        const card = document.createElement("article");
        card.className = `card ${item.destaqueFogo ? "on-fire" : ""}`;
        card.style.animationDelay = `${i * 0.07}s`;
        card.innerHTML = `
          ${item.destaqueFogo ? `<div class="fire-banner">🔥 Oportunidade Única • Excelente Custo-Benefício • Sai Rápido</div>` : ""}
          <div class="carousel">
            <span class="badge-cat">${catLabel}</span>
            <img id="img-${item.id}" src="${currentSrc}" alt="${item.titulo}" onclick="openZoom('${currentSrc}')" onerror="fallbackImg(this, '${currentSrc}')" />
            ${fotos.length > 1 ? `
              <button class="nav-btn prev-btn" onclick="changePhoto('${item.id}', -1)">&#10094;</button>
              <button class="nav-btn next-btn" onclick="changePhoto('${item.id}', 1)">&#10095;</button>
            ` : ""}
            <span class="photo-counter" id="count-${item.id}">${idx + 1} / ${fotos.length}</span>
          </div>
          <div class="card-body">
            <div class="price">${item.preco}</div>
            <h2 class="title">${item.titulo}</h2>
            <div class="location">📍 ${item.localizacao}</div>
            <ul class="features">
              ${item.caracteristicas.map(c => `<li>✓ ${c}</li>`).join("")}
            </ul>
            <a class="btn-whats" href="${waLink}" target="_blank" rel="noopener">
              ${item.destaqueFogo ? "🔥 Garantir Visita Agora" : "📲 Consultar / Agendar Visita"}
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function changePhoto(id, step) {
      const item = imoveis.find(i => i.id === id);
      if (!item || !item.fotos.length) return;
      const total = item.fotos.length;
      photoIndexes[id] = (photoIndexes[id] + step + total) % total;

      const imgEl = document.getElementById(`img-${id}`);
      const countEl = document.getElementById(`count-${id}`);
      const newSrc = item.fotos[photoIndexes[id]];

      imgEl.onerror = function () { fallbackImg(this, newSrc); };
      imgEl.src = newSrc;
      imgEl.setAttribute("onclick", `openZoom('${newSrc}')`);
      countEl.textContent = `${photoIndexes[id] + 1} / ${total}`;
    }

    function openAdminPanel() {
      renderAdminList();
      cancelEdit();
      document.getElementById("admin-modal").classList.add("open");
    }

    function renderAdminList() {
      const list = document.getElementById("admin-list");
      list.innerHTML = "";

      imoveis.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "admin-item-row";
        row.innerHTML = `
          <div>
            <strong style="color:#fff;">${item.destaqueFogo ? "🔥 " : ""}${item.titulo}</strong>
            <div style="font-size:0.82rem; color:var(--gold-bright);">${item.preco} • ${item.cidade}</div>
          </div>
          <div class="admin-actions">
            <button class="btn-secondary" onclick="toggleFire(${index})">${item.destaqueFogo ? "Tirar Fogo" : "🔥 Fogo"}</button>
            <button class="btn-secondary" onclick="openEditForm(${index})">Editar</button>
            <button class="btn-danger" onclick="deleteProperty(${index})">Excluir</button>
          </div>
        `;
        list.appendChild(row);
      });
    }

    function toggleFire(index) {
      imoveis[index].destaqueFogo = !imoveis[index].destaqueFogo;
      persistData();
    }

    function openEditForm(index = -1) {
      const box = document.getElementById("edit-form-container");
      box.style.display = "block";
      document.getElementById("edit-index").value = index;

      if (index >= 0) {
        const item = imoveis[index];
        document.getElementById("form-title").textContent = `Editando: ${item.titulo}`;
        document.getElementById("f-titulo").value = item.titulo;
        document.getElementById("f-preco").value = item.preco;
        document.getElementById("f-categoria").value = item.categoria;
        document.getElementById("f-cidade").value = item.cidade;
        document.getElementById("f-localizacao").value = item.localizacao;
        document.getElementById("f-caracteristicas").value = item.caracteristicas.join("\n");
        document.getElementById("f-fotos").value = item.fotos.join("\n");
        document.getElementById("f-destaque").checked = !!item.destaqueFogo;
      } else {
        document.getElementById("form-title").textContent = "Novo Imóvel";
        document.getElementById("f-titulo").value = "";
        document.getElementById("f-preco").value = "";
        document.getElementById("f-categoria").value = "locacao";
        document.getElementById("f-cidade").value = "Itaquaquecetuba";
        document.getElementById("f-localizacao").value = "";
        document.getElementById("f-caracteristicas").value = "";
        document.getElementById("f-fotos").value = "";
        document.getElementById("f-destaque").checked = false;
      }
    }

    function cancelEdit() {
      document.getElementById("edit-form-container").style.display = "none";
    }

    function saveProperty() {
      const index = parseInt(document.getElementById("edit-index").value, 10);
      const titulo = document.getElementById("f-titulo").value.trim();
      const preco = document.getElementById("f-preco").value.trim();
      const categoria = document.getElementById("f-categoria").value;
      const cidade = document.getElementById("f-cidade").value.trim() || "Itaquaquecetuba";
      const localizacao = document.getElementById("f-localizacao").value.trim();
      const caracteristicas = document.getElementById("f-caracteristicas").value
        .split("\n").map(s => s.trim()).filter(Boolean);
      const fotos = document.getElementById("f-fotos").value
        .split("\n").map(s => s.trim()).filter(Boolean);
      const destaqueFogo = document.getElementById("f-destaque").checked;

      if (!titulo || !preco) {
        alert("Preencha pelo menos o título e o preço.");
        return;
      }

      const novoObj = {
        id: index >= 0 ? imoveis[index].id : `REF-0${imoveis.length + 1}`,
        titulo,
        categoria,
        cidade,
        localizacao,
        preco,
        destaqueFogo,
        fotos: fotos.length ? fotos : ["img/casa1.jpg"],
        caracteristicas
      };

      if (index >= 0) {
        imoveis[index] = novoObj;
      } else {
        imoveis.unshift(novoObj);
      }

      cancelEdit();
      persistData();
    }

    function deleteProperty(index) {
      if (confirm(`Deseja realmente excluir "${imoveis[index].titulo}"?`)) {
        imoveis.splice(index, 1);
        persistData();
      }
    }

    function persistData() {
      localStorage.setItem("simone_catalogo_v2", JSON.stringify(imoveis));
      updateCityDropdown();
      renderAdminList();
      renderProperties();
    }

    function resetDefaultData() {
      if (confirm("Voltar para os 3 imóveis originais?")) {
        localStorage.removeItem("simone_catalogo_v2");
        imoveis = JSON.parse(JSON.stringify(DEFAULT_IMOVEIS));
        persistData();
      }
    }

    function exportUpdatedCode() {
      const jsonStr = JSON.stringify(imoveis, null, 6);
      const fullHtml = document.documentElement.outerHTML.replace(
        /const DEFAULT_IMOVEIS = \[[\s\S]*?\];/,
        `const DEFAULT_IMOVEIS = ${jsonStr};`
      );
      navigator.clipboard.writeText("<!DOCTYPE html>\n" + fullHtml).then(() => {
        alert("Código HTML completo copiado! Agora é só colar no seu index.html no GitHub para atualizar para todos os clientes.");
      });
    }

    function updateCityDropdown() {
      const select = document.getElementById("city-filter");
      const cidades = [...new Set(imoveis.map(i => i.cidade))];
      select.innerHTML = `<option value="todas">Todas as Cidades</option>` +
        cidades.map(c => `<option value="${c}">${c}</option>`).join("");
    }

    function openZoom(src) {
      document.getElementById("modal-img").src = src;
      document.getElementById("photo-modal").classList.add("open");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    document.querySelectorAll("#category-filters .filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#category-filters .filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.dataset.cat;
        renderProperties();
      });
    });

    document.getElementById("city-filter").addEventListener("change", (e) => {
      currentCity = e.target.value;
      renderProperties();
    });

    updateCityDropdown();
    renderProperties();
  </script>
</body>
</html>
